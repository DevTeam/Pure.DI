name: Publish NuGet packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (2.5.8 or 2.5.8-preview.1)'
        required: true
        type: string
      publish:
        description: 'Publish the built packages to NuGet.org'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  # Resolves the version tag to the commit that all other jobs build.
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version tag
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_PACKAGES: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG
          # Canonical SemVer without a v prefix or build metadata.
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$') {
            throw 'Tag must be a canonical version such as 2.5.8 or 2.5.8-preview.1.'
          }
          git fetch --no-tags origin "refs/tags/${version}:refs/tags/${version}"
          if ($LASTEXITCODE -ne 0) { throw 'Version tag was not found.' }
          $commit = git rev-parse --verify "refs/tags/${version}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Tag does not point to a commit.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "Tag: $version`n`nCommit: $commit`n`nPublish: $env:PUBLISH_PACKAGES" >> $env:GITHUB_STEP_SUMMARY

  # Builds and tests the generator for each Roslyn version in parallel, as the "Pure.DI check" workflow does.
  # The versions must match Settings.CodeAnalysis in build/Core/Settings.cs:
  # an unknown version fails its job, and a missing one fails the "pack" job.
  generator:
    name: generator (Roslyn ${{ matrix.roslyn }}${{ matrix.codeSize == 'only' && ', code size' || '' }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        roslyn: [ '5.6', '4.8', '4.3' ]
        codeSize: [ 'skip' ]
        include:
          - roslyn: newest
            codeSize: only
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.version }}
          ROSLYN: ${{ matrix.roslyn }}
          CODE_SIZE: ${{ matrix.codeSize }}
        run: |
          dotnet run --project ./build -- "-p:version=$env:PACKAGE_VERSION" "-p:roslyn=$env:ROSLYN" "-p:codeSize=$env:CODE_SIZE" generator
          if ($LASTEXITCODE -ne 0) { throw 'Generator build or tests failed.' }

      - name: Save generator package
        if: ${{ matrix.codeSize != 'only' }}
        uses: actions/upload-artifact@v4
        with:
          name: generator-${{ matrix.roslyn }}
          path: .packages/${{ matrix.roslyn }}/Pure.DI.${{ needs.release.outputs.version }}.nupkg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Merges the generator packages, creates the other packages and checks them.
  pack:
    needs: [ release, generator ]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.release.outputs.version }}
      commit: ${{ needs.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout release sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
          path: source
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Load generator packages
        uses: actions/download-artifact@v4
        with:
          pattern: generator-*
          path: source/.packages

      - name: Arrange generator packages by Roslyn version
        working-directory: source
        shell: bash
        run: |
          for dir in .packages/generator-*; do
            mv "$dir" ".packages/${dir#.packages/generator-}"
          done
          ls -R .packages

      - name: Build and check packages
        working-directory: source
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          dotnet run --project ./build -- "-p:version=$env:PACKAGE_VERSION" "-p:roslyn=prebuilt" pack
          if ($LASTEXITCODE -ne 0) { throw 'Package build or compatibility checks failed.' }
          dotnet run --project ./build -- "-p:version=$env:PACKAGE_VERSION" "-p:templatePackageSource=$PWD/.packages" template
          if ($LASTEXITCODE -ne 0) { throw 'Template build or smoke tests failed.' }

      - name: Smoke test agent installer
        working-directory: source
        shell: pwsh
        run: ./tests/Pure.DI.Agent.ToolSmoke.ps1 -ToolDll ./src/Pure.DI.Agent/bin/Release/net8.0/Pure.DI.Agent.dll

      - name: Validate release packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: ./.github/scripts/Validate-NuGetPackages.ps1 -Directory source/.packages -Version $env:PACKAGE_VERSION

      - name: Save NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: source/.packages/*.nupkg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.publish }}
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages

      - name: Validate release packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
        run: ./.github/scripts/Validate-NuGetPackages.ps1 -Directory packages -Version $env:PACKAGE_VERSION

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
          RELEASE_COMMIT: ${{ needs.pack.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in @('Pure.DI', 'Pure.DI.MS', 'Pure.DI.Abstractions', 'Pure.DI.Agent', 'Pure.DI.Templates')) {
            dotnet nuget push "packages/$id.$env:PACKAGE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $id failed. Already pushed packages remain published; rerun this job to resume." }
            "Processed $id $env:PACKAGE_VERSION (existing versions skipped)." >> $env:GITHUB_STEP_SUMMARY
          }
          "`nRelease commit: $env:RELEASE_COMMIT" >> $env:GITHUB_STEP_SUMMARY
